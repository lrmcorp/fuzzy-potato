name: arah

services:
  arah:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env.vps
    environment:
      ARAH_REVISION: ${ARAH_REVISION:-unknown}
      # Override with ARAH_PUBLIC_URL in .env.vps; deploy/vps-up.sh passes it through.
      ARAH_PUBLIC_URL: ${ARAH_PUBLIC_URL:-https://arah.hasseedev.com}
    volumes:
      - arah_data:/data
    networks:
      edge:
        aliases: [arah]
    # No published ports: only the Caddy container on lnint-edge reaches arah:8787.

networks:
  # Shared with the Caddy container from lrmcorp/ln, which serves arah.hasseedev.com.
  edge:
    name: lnint-edge
    external: true

volumes:
  arah_data:
